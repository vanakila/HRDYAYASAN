<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - HRD POMOSDA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="initAdmin()">
    <header class="header">
        <div class="header-brand">HRD POMOSDA - Admin</div>
        <div class="user-info">
            <span id="user-email">Admin</span>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>Daftar Karyawan Yayasan Lil-Muqorrobien</h2>
                <button onclick="openModal()" class="btn btn-primary" style="width: auto;">+ Tambah Karyawan</button>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>NIK</th>
                            <th>Nama Lengkap</th>
                            <th>UPT</th>
                            <th>Status</th>
                            <th>No. HP</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="karyawan-list">
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="karyawanModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Tambah Data Karyawan</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="karyawan-form">
                <h3 class="section-title">1. Data Pribadi Karyawan</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nomor Induk Karyawan (NIK)*</label>
                        <input type="text" id="nik" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Nama Lengkap*</label>
                        <input type="text" id="nama_lengkap" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Tempat Lahir</label>
                        <input type="text" id="tempat_lahir" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Tanggal Lahir</label>
                        <input type="date" id="tanggal_lahir" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Jenis Kelamin</label>
                        <select id="jenis_kelamin" class="form-control">
                            <option value="">Pilih...</option>
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status Perkawinan</label>
                        <select id="status_perkawinan" class="form-control">
                            <option value="">Pilih...</option>
                            <option value="Belum Kawin">Belum Kawin</option>
                            <option value="Kawin">Kawin</option>
                            <option value="Cerai Hidup">Cerai Hidup</option>
                            <option value="Cerai Mati">Cerai Mati</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Jumlah Anak</label>
                        <input type="number" id="jumlah_anak" class="form-control" value="0">
                    </div>
                    <div class="form-group">
                        <label>Nomor HP</label>
                        <input type="text" id="nomor_hp" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Alamat Email Pribadi</label>
                        <input type="email" id="email_pribadi" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Alamat Sesuai KTP</label>
                        <input type="text" id="alamat_ktp" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Nomor NPWP</label>
                        <input type="text" id="nomor_npwp" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Nomor BPJS/KIS</label>
                        <input type="text" id="nomor_bpjs" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Status Kejamaahan</label>
                        <input type="text" id="status_kejamaahan" class="form-control">
                    </div>
                </div>

                <h3 class="section-title">2. Informasi Pekerjaan (Administratif)</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tanggal Mulai Bekerja</label>
                        <input type="date" id="tanggal_mulai_bekerja" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>UPT (Unit Pelaksana Teknis)</label>
                        <input type="text" id="upt" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Fungsi / Jabatan</label>
                        <input type="text" id="fungsi" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Status Karyawan</label>
                        <select id="status_karyawan" class="form-control">
                            <option value="">Pilih...</option>
                            <option value="PTY">PTY</option>
                            <option value="PTT">PTT</option>
                            <option value="GTY">GTY</option>
                            <option value="GTT">GTT</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Total JP/Minggu</label>
                        <input type="number" id="total_jp" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Rincian Tugas</label>
                        <input type="text" id="rincian_tugas" class="form-control">
                    </div>
                </div>

                <h3 class="section-title">3. Data Kinerja & Kompetensi</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Pendidikan Terakhir</label>
                        <input type="text" id="pendidikan_terakhir" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Nama Sekolah/Perguruan Tinggi</label>
                        <input type="text" id="nama_sekolah" class="form-control">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Riwayat Pelatihan/Sertifikasi</label>
                        <textarea id="riwayat_pelatihan" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                
                <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn" style="background:#e2e8f0;color:#0f172a;" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-primary" style="width:auto;">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
