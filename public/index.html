<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HRD POMOSDA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>HRD POMOSDA</h1>
            <p>Sistem Data Karyawan Yayasan Lil-Muqorrobien</p>
            
            <div id="login-error" style="color: var(--danger); margin-bottom: 1rem; display: none;"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="Masukkan email anda">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">Masuk</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
